name: Profile contribution checkpoint batch

on:
  push:
    branches:
      - maintenance/empty-commits-20261031
    paths:
      - .github/workflows/profile-contributions-20261031.yml

permissions:
  contents: write

concurrency:
  group: profile-contribution-batch-20261031
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main for an additive, content-neutral history update
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Create 10000 correctly attributed empty commits on main
        shell: bash
        env:
          GIT_AUTHOR_NAME: Upgrade
          GIT_AUTHOR_EMAIL: lyutovvadim@gmail.com
          GIT_COMMITTER_NAME: Upgrade
          GIT_COMMITTER_EMAIL: lyutovvadim@gmail.com
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          git -c commit.gpgsign=false status --porcelain
          test -z "$(git status --porcelain)"
          for ((i = 1; i <= 10000; i++)); do
            printf -v n '%05d' "$i"
            git -c commit.gpgsign=false commit --allow-empty -m "chore: empty contribution checkpoint $n/10000 [skip ci]" >/dev/null
          done
          test "$(git rev-list --count "$base"..HEAD)" = 10000
          git diff --quiet "$base" HEAD
          test "$(git rev-parse "$base^{tree}")" = "$(git rev-parse HEAD^{tree})"
          git push origin HEAD:refs/heads/main
          echo "Pushed 10000 empty authored commits to main, unchanged file tree"
