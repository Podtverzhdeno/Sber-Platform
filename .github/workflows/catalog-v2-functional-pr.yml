name: Catalog V2 functional browser regression
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/e2e/task-catalog-v2.spec.ts"
      - "frontend/e2e/task-catalog-v2-visual.spec.ts"
      - "frontend/src/features/task-catalog-v2/**"
      - ".github/workflows/catalog-v2-functional-pr.yml"
  push:
    branches: [main]
    paths:
      - "frontend/e2e/task-catalog-v2.spec.ts"
      - ".github/workflows/catalog-v2-functional-pr.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Check filters, list actions, consent, performance and mobile details
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test task-catalog-v2.spec.ts --project=chromium --reporter=line
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-v2-functional-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
