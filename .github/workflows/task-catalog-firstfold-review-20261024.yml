name: Task catalog true first-fold nonoverlap QA
on:
  push:
    branches: [codex/task-catalog-firstfold-verification-20261024]
    paths: [.github/workflows/task-catalog-firstfold-review-20261024.yml]
permissions:
  contents: read
jobs:
  task-source-sized-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact PR 35 first-fold fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4de39342470c9f11fb4da36a337a946cc7f6efbc
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exact 1672x941 layout assertions and screenshot captures
        env:
          CAPTURE_APPROVED_TASKS: "1"
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: npx playwright test e2e/task-catalog-approved-geometry.spec.ts --workers=1 --reporter=line
      - name: Save actual first-fold screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-catalog-approved-1672-firstfold
          path: frontend/test-results/approved-geometry-*.png
          retention-days: 14
          if-no-files-found: warn
