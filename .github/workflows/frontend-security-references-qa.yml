name: Frontend exact source security QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/scripts/check-built-security.mjs"
      - "frontend/tsconfig.node.json"
      - ".github/workflows/frontend-security-references-qa.yml"
  pull_request:
    paths:
      - "frontend/scripts/check-built-security.mjs"
      - "frontend/tsconfig.node.json"
      - ".github/workflows/frontend-security-references-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-source-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint typed production-browser configuration
        run: npx eslint production-playwright.config.ts --max-warnings 0
      - name: Verify typed config and browser tests
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Build the actual production bundle for isolated security verification
        # App-wide tsc remains a required gate in ci.yml.
        # Isolate this security test from concurrent app TS errors.
        run: npx vite build
      - name: Verify strict CSP and exact public-source allowlist
        run: npm run security:check
      - name: Ensure an unapproved external link is still rejected
        run: |
          printf '%s\n' 'const unexpected="https://unapproved.example/privacy-bypass";' > dist/assets/security-negative-regression.js
          if npm run security:check > /tmp/security-negative.log 2>&1; then
            echo "::error::Scanner accepted unapproved URL"
            exit 1
          fi
          if ! grep -q 'https://unapproved.example/privacy-bypass' /tmp/security-negative.log; then
            echo "::error::Scanner rejected for a reason other than unknown URL"
            cat /tmp/security-negative.log
            exit 1
          fi
          rm dist/assets/security-negative-regression.js
