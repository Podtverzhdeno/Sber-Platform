name: Complete first 63 historical pixel days
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-2014-pixels.yml']
permissions:
  contents: write
jobs:
  complete:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Create missing 63 pixel contributions and delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          test -z "$(git status --porcelain)"
          cat > /tmp/missing.txt <<'DATES'
          2014-03-09
          2014-03-15
          2014-03-16
          2014-03-17
          2014-03-18
          2014-03-19
          2014-03-20
          2014-03-21
          2014-03-22
          2014-03-23
          2014-03-29
          2014-04-13
          2014-04-14
          2014-04-15
          2014-04-16
          2014-04-17
          2014-04-18
          2014-04-19
          2014-04-20
          2014-04-23
          2014-04-26
          2014-04-27
          2014-04-30
          2014-05-03
          2014-05-04
          2014-05-07
          2014-05-10
          2014-05-12
          2014-05-13
          2014-05-15
          2014-05-16
          2014-05-25
          2014-05-26
          2014-05-27
          2014-05-28
          2014-05-29
          2014-05-30
          2014-05-31
          2014-06-01
          2014-06-04
          2014-06-08
          2014-06-11
          2014-06-12
          2014-06-15
          2014-06-18
          2014-06-20
          2014-06-23
          2014-06-24
          2014-06-28
          2014-07-06
          2014-07-07
          2014-07-08
          2014-07-09
          2014-07-10
          2014-07-11
          2014-07-12
          2014-07-13
          2014-07-16
          2014-07-19
          2014-07-20
          2014-07-23
          2014-07-26
          2014-07-27
          DATES
          test "$(wc -l < /tmp/missing.txt)" -eq 63
          git config user.name Podtverzhdeno
          git config user.email 187974942+Podtverzhdeno@users.noreply.github.com
          git rm .github/workflows/fix-2014-pixels.yml
          git commit -m "ci: remove temporary 2014 pixel completion workflow"
          python3 - <<'PY'
          import os, subprocess
          dates = open('/tmp/missing.txt').read().splitlines()
          assert len(dates)==len(set(dates))==63
          base = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          parent=base
          for i,date in enumerate(dates,1):
              env=dict(os.environ)
              env.update(GIT_AUTHOR_NAME='Podtverzhdeno',GIT_AUTHOR_EMAIL='187974942+Podtverzhdeno@users.noreply.github.com',GIT_COMMITTER_NAME='Podtverzhdeno',GIT_COMMITTER_EMAIL='187974942+Podtverzhdeno@users.noreply.github.com',GIT_AUTHOR_DATE=date+'T12:00:00 +0000',GIT_COMMITTER_DATE=date+'T12:00:00 +0000')
              parent=subprocess.check_output(['git','commit-tree',tree,'-p',parent,'-m',f'chore(contributions): complete 2014 pixel {i:02d}/63 [skip ci]'],text=True,env=env).strip()
          subprocess.run(['git','update-ref','refs/heads/main',parent,base],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/main'],check=True)
          print('PIXEL_2014_COMPLETION_SUCCESS',parent,flush=True)
          PY
