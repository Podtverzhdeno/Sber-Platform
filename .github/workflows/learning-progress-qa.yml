name: Cross-section learning integration QA

on:
  push:
    branches: [main]
    paths:
      - "src/impulse/bootcamp/editorial_learning.py"
      - "tests/bootcamp/test_impulse_study.py"
      - "frontend/src/features/learning-progress*"
      - "frontend/src/features/bootcamp/**"
      - "frontend/src/features/analytics*"
      - "frontend/src/features/trajectory-v2/**"
      - "frontend/src/features/portfolio-v2*"
      - "frontend/src/api/**"
      - "frontend/e2e/bootcamp-immersive.spec.ts"
      - "frontend/e2e/bootcamp-reference-fixtures.ts"
      - ".github/workflows/learning-progress-qa.yml"
  pull_request:
    paths:
      - "src/impulse/bootcamp/editorial_learning.py"
      - "tests/bootcamp/test_impulse_study.py"
      - "frontend/src/features/learning-progress*"
      - "frontend/src/features/bootcamp/**"
      - "frontend/src/features/analytics*"
      - "frontend/src/features/trajectory-v2/**"
      - "frontend/src/api/**"
      - "frontend/e2e/bootcamp-immersive.spec.ts"
      - "frontend/e2e/bootcamp-reference-fixtures.ts"
      - ".github/workflows/learning-progress-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persisted-learning-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulse
          POSTGRES_USER: impulse
          POSTGRES_PASSWORD: impulse-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U impulse -d impulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      TEST_DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check src/impulse/bootcamp/editorial_learning.py tests/bootcamp/test_impulse_study.py
      - run: uv run ruff format --check src/impulse/bootcamp/editorial_learning.py tests/bootcamp/test_impulse_study.py
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/bootcamp/test_impulse_study.py -q

  cross-screen-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Test mutation policy and component types
        run: |
          npx vitest run src/api/cross-section-mutations.test.ts
          npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify finish to Analytics to Trajectory after reload
        env:
          CI: "true"
        run: npx playwright test bootcamp-immersive.spec.ts --grep "finished course appears" --project=chromium
      - name: Save browser traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-progress-qa
          path: frontend/test-results/
          if-no-files-found: ignore
