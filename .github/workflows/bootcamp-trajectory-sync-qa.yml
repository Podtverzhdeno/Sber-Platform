name: Bootcamp Trajectory Sync QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/bootcamp/trajectory-content.ts"
      - "frontend/src/features/bootcamp/trajectory-content.test.ts"
      - "frontend/src/features/bootcamp/catalog.tsx"
      - "frontend/src/features/trajectory-v2/source-reference/source-catalog.ts"
      - ".github/workflows/bootcamp-trajectory-sync-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootcamp-trajectory-sync-${{ github.sha }}
  cancel-in-progress: false

jobs:
  role-courses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Lint course-role mapping
        run: npx eslint src/features/bootcamp/trajectory-content.ts src/features/bootcamp/trajectory-content.test.ts --max-warnings 0
      - name: Test role-course mapping
        run: npx vitest run src/features/bootcamp/trajectory-content.test.ts
      - name: TypeScript contract check
        run: npm run typecheck
      - name: Bundle catalog
        run: npx vite build
