name: Task catalog visual baseline refresh (temporary)
on:
  push:
    branches:
      - codex/task-catalog-approved-layout-20261024
    paths:
      - .github/workflows/task-catalog-visual-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'Podtverzhdeno/Sber-Platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout visual baseline branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/task-catalog-approved-layout-20261024
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install frontend
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Align Linux fonts with primary CI
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-liberation fontconfig
          fc-cache -f
      - name: Render baseline images through Playwright
        env:
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: npx playwright test e2e/task-catalog-v2-visual.spec.ts --update-snapshots
      - name: Upload rendered baseline images for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-catalog-updated-baselines
          path: frontend/e2e/task-catalog-v2-visual.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 14
      - name: Commit scoped image baselines to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/task-catalog-v2-visual.spec.ts-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "test(tasks): refresh Linux visual baselines for approved catalog layout"
            git push origin HEAD:codex/task-catalog-approved-layout-20261024
          fi
        working-directory: .
