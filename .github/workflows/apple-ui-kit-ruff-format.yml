name: Apple UI Kit Ruff formatting

# One-shot repair of the reference package: formatting only, never generated assets.
# The workflow is also manually triggerable after reference scripts change.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apple-ui-kit-ruff-format.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apple-ui-kit-ruff-format-main
  cancel-in-progress: false

jobs:
  format-reference-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned formatter
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Apply safe import and lint fixes in the reference scripts
        run: uvx --from ruff==0.16.9 ruff check --fix --exit-zero "Apple UI kit"
      - name: Format Apple UI Kit scripts
        run: |
          uvx --from ruff==0.16.9 ruff format "Apple UI kit"
          uvx --from ruff==0.16.9 ruff format --check "Apple UI kit"
      - name: Commit only formatter changes
        run: |
          git add -- "Apple UI kit"
          if git diff --cached --quiet; then
            echo "Reference scripts already formatted"
            exit 0
          fi
          git diff --cached --check
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(apple-ui-kit): Ruff-format reference validation scripts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
