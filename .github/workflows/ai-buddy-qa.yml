name: AI-Buddy Focus QA

on:
  pull_request:
    paths:
      - "src/impulse/api/v1/buddy.py"
      - "src/impulse/application/buddy.py"
      - "src/impulse/infrastructure/buddy_store.py"
      - "frontend/src/features/buddy-workspace*"
      - "frontend/src/features/participant.tsx"
      - "tests/test_buddy_api.py"
      - ".github/workflows/ai-buddy-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buddy-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src/impulse/api/v1/buddy.py src/impulse/application/buddy.py src/impulse/infrastructure/buddy_store.py tests/test_buddy_api.py
      - run: uv run ruff format --check src/impulse/api/v1/buddy.py src/impulse/application/buddy.py src/impulse/infrastructure/buddy_store.py tests/test_buddy_api.py
      - run: uv run pytest -q tests/test_buddy_api.py
  buddy-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npx eslint src/features/buddy-workspace.tsx src/features/buddy-workspace.test.tsx src/features/participant.tsx --max-warnings 0
      - run: npx vitest run src/features/buddy-workspace.test.tsx src/features/participant.test.tsx
      - run: npm run typecheck
