name: One-time 12331 dated contribution checkpoints

on:
  push:
    branches:
      - ops/contributions-12331-20261031
    paths:
      - .github/workflows/one-time-12331-contributions-20261031.yml

permissions:
  contents: write

concurrency:
  group: one-time-12331-contributions-20261031
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Generate exactly 12331 empty commits dated October 31, 2026
        shell: bash
        env:
          GIT_AUTHOR_NAME: Podtverzhdeno
          GIT_AUTHOR_EMAIL: 187974942+Podtverzhdeno@users.noreply.github.com
          GIT_COMMITTER_NAME: Podtverzhdeno
          GIT_COMMITTER_EMAIL: 187974942+Podtverzhdeno@users.noreply.github.com
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          original_tree="$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
          git_date="$(date -u +'%Y-%m-%dT%H:%M:%S+00:00')"
          test "${git_date%%T*}" = "2026-10-31"
          export GIT_AUTHOR_DATE="$git_date"
          export GIT_COMMITTER_DATE="$git_date"
          for ((i=1; i<=12331; i++)); do
            printf -v seq '%05d' "$i"
            git -c commit.gpgsign=false commit --allow-empty -m "chore: empty contribution checkpoint $seq/12331 [skip ci]" >/dev/null
          done
          test "$(git rev-list --count "$base"..HEAD)" = "12331"
          test "$(git rev-parse HEAD^{tree})" = "$original_tree"
          git diff --quiet "$base" HEAD
          git push origin HEAD:refs/heads/main
          echo "SUCCESS: 12331 empty commits dated $git_date, unchanged tree, pushed to main"
