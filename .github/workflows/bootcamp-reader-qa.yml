name: Bootcamp Reader QA

on:
  push:
    branches: [main]
    paths:
      # Keep this expensive browser suite scoped to the lesson reader.
      # Broader catalog redraws have their own reference QA and may commit rapidly.
      - "frontend/src/features/bootcamp/bootcamp-approved.scss"
      - "frontend/src/features/bootcamp/route-v2.tsx"
      - "frontend/src/features/bootcamp/learning-content/CourseLearningContent.tsx"
      - "frontend/src/features/bootcamp/learning-content/learning-content.scss"
      - "frontend/src/components/ui.tsx"
      - "frontend/e2e/bootcamp-approved.spec.ts"
      - "frontend/e2e/bootcamp-forensic-audit.spec.ts"
      - ".github/workflows/bootcamp-reader-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

# Dedicated check: unrelated main branch commits cannot cancel reader QA.
concurrency:
  group: bootcamp-reader-${{ github.sha }}
  cancel-in-progress: false

jobs:
  reader:
    name: bootcamp-reader-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      # Collect browser evidence even if another parallel workstream temporarily
      # introduces static-analysis failures in the shared Bootcamp catalog.
      - name: Build Vite frontend for browser acceptance
        run: npx vite build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise reader buttons, layout, and five reference states
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test bootcamp-approved.spec.ts bootcamp-forensic-audit.spec.ts --project=chromium --reporter=line
      - name: Lint Bootcamp components and browser tests
        if: always()
        run: npx eslint src/features/bootcamp e2e/bootcamp-approved.spec.ts e2e/bootcamp-forensic-audit.spec.ts --max-warnings 0
      - name: Check TypeScript contracts
        if: always()
        run: npm run typecheck
      - name: Upload five screenshots and browser traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootcamp-reader-visual-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
