name: Growth Hours Provenance QA

on:
  pull_request:
    paths:
      - "src/impulse/application/growth.py"
      - "tests/test_growth_snapshot.py"
      - ".github/workflows/growth-hours-provenance-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-hours:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Format changed files
        run: uv run ruff format --check src/impulse/application/growth.py tests/test_growth_snapshot.py
      - name: Lint changed files
        run: uv run ruff check src/impulse/application/growth.py tests/test_growth_snapshot.py
      - name: Duration source regression
        run: uv run pytest -q tests/test_growth_snapshot.py
