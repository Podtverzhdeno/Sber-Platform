name: Portfolio Reference QA
on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/portfolio-v2.tsx"
      - "frontend/src/features/portfolio-v2.scss"
      - "frontend/src/features/portfolio-skill-model.ts"
      - "frontend/src/features/portfolio-skill-model.test.ts"
      - "frontend/e2e/portfolio.spec.ts"
      - "frontend/e2e/portfolio-evidence-chart.spec.ts"
      - ".github/workflows/portfolio-reference-qa.yml"
  pull_request:
    paths:
      - "frontend/src/features/portfolio-v2.tsx"
      - "frontend/src/features/portfolio-v2.scss"
      - "frontend/src/features/portfolio-skill-model.ts"
      - "frontend/src/features/portfolio-skill-model.test.ts"
      - "frontend/e2e/portfolio.spec.ts"
      - "frontend/e2e/portfolio-evidence-chart.spec.ts"
      - ".github/workflows/portfolio-reference-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-reference-${{ github.sha }}
  cancel-in-progress: false
jobs:
  portfolio-geometry-and-behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Lint portfolio
        run: npx eslint src/features/portfolio-v2.tsx e2e/portfolio.spec.ts --max-warnings 0
      - name: Test verified portfolio evidence model
        run: npx vitest run src/features/portfolio-skill-model.test.ts
      - name: Full-repository Typecheck (informational while parallel rating API work lands)
        continue-on-error: true
        run: npm run typecheck
      - name: Build Vite bundle for browser QA
        run: npx vite build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser functional and geometry acceptance
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test portfolio.spec.ts portfolio-evidence-chart.spec.ts --project=chromium --reporter=line
      - name: Save screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio-v2-reference-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
