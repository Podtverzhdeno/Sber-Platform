name: Render historical contribution typography (one time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pixel-calendar-2014-2023.yml']
permissions:
  contents: write
jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Create 1,063 date-authored empty commits without modifying project files
