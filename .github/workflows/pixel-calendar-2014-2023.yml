          DATES
          test "$(wc -l < /tmp/pixel-dates.txt)" -eq 1063
          git config user.name Podtverzhdeno
          git config user.email 187974942+Podtverzhdeno@users.noreply.github.com
          git rm .github/workflows/pixel-calendar-2014-2023.yml
          git commit -m "ci: remove one-shot historical typography painter"
          python3 - <<'PY'
          import os, subprocess
          with open('/tmp/pixel-dates.txt', encoding='utf-8') as f:
              dates = [s.strip() for s in f if s.strip()]
          assert len(dates) == len(set(dates)) == 1063
          assert all(2014 <= int(d[:4]) <= 2023 for d in dates)
          base = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          parent = base
          for i, d in enumerate(dates, 1):
              env = dict(os.environ)
              env['GIT_AUTHOR_NAME'] = 'Podtverzhdeno'
              env['GIT_AUTHOR_EMAIL'] = '187974942+Podtverzhdeno@users.noreply.github.com'
              env['GIT_COMMITTER_NAME'] = 'Podtverzhdeno'
              env['GIT_COMMITTER_EMAIL'] = '187974942+Podtverzhdeno@users.noreply.github.com'
              env['GIT_AUTHOR_DATE'] = d+'T12:00:00 +0000'
              env['GIT_COMMITTER_DATE'] = d+'T12:00:00 +0000'
              parent = subprocess.check_output(['git','commit-tree',tree,'-p',parent,'-m',f'chore(contributions): {d[:4]} pixel {i:04d}/1063 [skip ci]'],env=env,text=True).strip()
              if i % 100 == 0: print(f'COMMIT_PROGRESS {i}/1063', flush=True)
          subprocess.run(['git','update-ref','refs/heads/main',parent,base],check=True)
          print('FINAL_PIXEL_SHA',parent,flush=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/main'],check=True)
          print('PIXEL_PUSH_SUCCESS',flush=True)
          PY
