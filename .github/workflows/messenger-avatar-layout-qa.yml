name: Messenger Avatar Layout QA

on:
  pull_request:
    paths:
      - "frontend/src/features/messenger/**"
      - "frontend/e2e/messages-reference.spec.ts"
      - ".github/workflows/messenger-avatar-layout-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Strict lint changed files
        run: npx eslint src/features/messenger/dialog-avatar.tsx src/features/messenger/dialog-avatar.test.tsx src/features/messenger/dialogs.tsx src/features/messenger/chat-history.tsx src/features/messenger/chat-history.test.tsx src/features/messenger/context.tsx src/features/messenger/community-details.tsx e2e/messages-reference.spec.ts --max-warnings 0
      - name: Typecheck
        run: npm run typecheck
      - name: Avatar and existing messenger tests
        run: npx vitest run src/features/messenger/dialog-avatar.test.tsx src/features/messenger/dialogs.test.tsx src/features/messenger/chat-history.test.tsx src/features/messenger/context.test.tsx
      - name: Production build
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Layout stability browser check
        run: npx playwright test e2e/messages-reference.spec.ts --grep "switching between direct and group chats" --project=chromium --reporter=line
        env:
          CI: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: messenger-avatar-layout-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
