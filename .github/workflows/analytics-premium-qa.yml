name: Premium Activity Visual QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/analytics-v3/**"
      - "frontend/e2e/analytics-premium.spec.ts"
      - "frontend/public/analytics-premium/**"
      - ".github/workflows/analytics-premium-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-activity-${{ github.sha }}
  cancel-in-progress: false

jobs:
  premium-activity-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Lint new analytics and browser tests
        run: npx eslint src/features/analytics-v3/activity-premium.tsx src/features/analytics-v3/page.tsx e2e/analytics-premium.spec.ts --max-warnings 0
      - name: Check TypeScript contracts
        run: npm run typecheck
      - name: Bundle frontend
        run: npx vite build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify UI at desktop and mobile widths
        env:
          CI: "true"
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: npx playwright test analytics-premium.spec.ts --project=chromium --reporter=line
      - name: Save screenshots and errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytics-premium-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
