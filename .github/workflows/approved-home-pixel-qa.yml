name: Approved home 1672 pixel QA

on:
  pull_request:
    paths:
      - "frontend/src/features/owner-live-pixel/**"
      - "frontend/src/features/pixel-reference/**"
      - "frontend/src/App.tsx"
      - "frontend/public/impulse-approved-*.svg"
      - "frontend/e2e/approved-home-1672.spec.ts"
      - "frontend/e2e/owner-live-pixel.spec.ts"
      - ".github/workflows/approved-home-pixel-qa.yml"
  push:
    branches: [main]
    paths:
      - "frontend/src/features/owner-live-pixel/**"
      - "frontend/src/features/pixel-reference/**"
      - "frontend/src/App.tsx"
      - "frontend/public/impulse-approved-*.svg"
      - "frontend/e2e/approved-home-1672.spec.ts"
      - ".github/workflows/approved-home-pixel-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-home-${{ github.sha }}
  cancel-in-progress: false

jobs:
  approved-home-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Lint modified home and pixel tests
        run: npx eslint src/App.tsx src/features/owner-live-pixel src/features/pixel-reference e2e/approved-home-1672.spec.ts e2e/owner-live-pixel.spec.ts --max-warnings 0
      - name: Verify TypeScript and build
        run: npm run typecheck && npm run build
      - name: Pixel React unit regression
        run: npx vitest run src/features/pixel-reference/ImpulsePixelReference.test.tsx src/features/pixel-integration/PixelParticipantShell.test.tsx
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify approved 1672 desktop + mobile + existing 1422 reference
        env:
          CI: "true"
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: npx playwright test approved-home-1672.spec.ts owner-live-pixel.spec.ts --project=chromium --workers=2 --reporter=line
      - name: Upload source-comparable screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-home-1672-screenshots
          path: |
            frontend/test-results/impulse-approved-home-*.png
            frontend/test-results/**/*.png
            frontend/test-results/**/*.zip
          retention-days: 14
          if-no-files-found: warn
