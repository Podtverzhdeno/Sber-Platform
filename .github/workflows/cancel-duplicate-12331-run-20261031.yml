name: Stop duplicate contribution run safely
on:
  push:
    branches:
      - ops/contributions-12331-20261031
    paths:
      - .github/workflows/cancel-duplicate-12331-run-20261031.yml
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate 12331-commit workflow, preserve the already-pushing other run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Podtverzhdeno/Sber-Platform/actions/runs/41236294942/cancel
          echo "Cancellation request submitted for duplicate run 41236294942"
