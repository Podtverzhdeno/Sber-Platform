name: Role selection header QA
on:
  pull_request:
    paths:
      - "frontend/src/App.tsx"
      - "frontend/src/role-selection-header.test.tsx"
      - ".github/workflows/role-selection-header-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-picker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Strict lint changed files
        run: npx eslint src/App.tsx src/role-selection-header.test.tsx --max-warnings 0
      - name: Role chooser regression
        run: npx vitest run src/role-selection-header.test.tsx
      - name: Frontend build
        run: npm run build
