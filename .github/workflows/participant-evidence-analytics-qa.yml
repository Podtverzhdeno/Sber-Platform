name: Participant Evidence Analytics QA
on:
  pull_request:
    paths:
      - "frontend/src/features/participant-evidence*"
      - "frontend/src/features/analytics-reference*"
      - "frontend/src/features/agentic-coding-profile.tsx"
      - "frontend/src/features/learning-progress.ts"
      - ".github/workflows/participant-evidence-analytics-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  participant-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Strict lint for affected sources
        run: npx eslint src/features/participant-evidence.tsx src/features/participant-evidence.test.tsx src/features/analytics-reference.tsx src/features/analytics-reference.test.tsx src/features/agentic-coding-profile.tsx src/features/learning-progress.ts --max-warnings 0
      - run: npm run typecheck
      - name: Participant data and source isolation tests
        run: npx vitest run src/features/participant-evidence.test.tsx src/features/analytics-reference.test.tsx src/features/agentic-coding-profile.test.tsx
      - run: npm run build
