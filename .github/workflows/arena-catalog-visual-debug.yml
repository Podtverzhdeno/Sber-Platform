---
name: arena-catalog-visual-debug

on:
  push:
    branches:
      - arena/7e954673-sber-platform
    paths:
      - .github/workflows/arena-catalog-visual-debug.yml

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  refresh_visual_baselines:
    name: refresh-catalog-and-messenger-baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the fixed working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: arena/7e954673-sber-platform
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Align Linux fonts with CI
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-liberation fontconfig
          fc-cache -f
      - name: Refresh only declared visual baselines
        working-directory: frontend
        env:
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: >-
          npx playwright test
          e2e/task-catalog-v2-visual.spec.ts
          e2e/messenger-visual.spec.ts
          --update-snapshots
      - name: Commit CI-renderer baselines to the same branch
        run: |
          if git diff --quiet -- frontend/e2e/task-catalog-v2-visual.spec.ts-snapshots frontend/e2e/messenger-visual.spec.ts-snapshots; then
            echo "CI baselines are already current"
            exit 0
          fi
          git config user.name "arena-visual-baseline-bot"
          git config user.email "noreply@localhost"
          git add frontend/e2e/task-catalog-v2-visual.spec.ts-snapshots frontend/e2e/messenger-visual.spec.ts-snapshots
          git commit -m "test(e2e): record exact CI renderer baselines"
          git push origin arena/7e954673-sber-platform

  real_api_diagnostics:
    name: catalog-real-api-diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulse
          POSTGRES_USER: impulse
          POSTGRES_PASSWORD: impulse-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U impulse -d impulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      APP_ENV: test
    steps:
      - name: Check out the fixed working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: arena/7e954673-sber-platform
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend dependencies
        run: uv sync --frozen
      - name: Apply migrations and synthetic demo data
        run: |
          uv run alembic upgrade head
          uv run impulse-demo-seed
      - name: Start backend
        run: |
          nohup uv run uvicorn impulse.main:app --host 127.0.0.1 --port 8000 --app-dir . > /tmp/catalog-backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 http://127.0.0.1:8000/health/ready || true)
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/catalog-backend.log
          exit 1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run only real-API catalog contracts
        working-directory: frontend
        env:
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: |
          set -o pipefail
          npx playwright test e2e/task-catalog-v2-real-api.spec.ts --workers=1 2>&1 | tee /tmp/catalog-real-api.log
      - name: Publish focused failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          import urllib.parse
          log = pathlib.Path('/tmp/catalog-real-api.log')
          text = log.read_text(encoding='utf-8', errors='replace') if log.exists() else 'missing real-api log'
          backend = pathlib.Path('/tmp/catalog-backend.log')
          backend_text = backend.read_text(encoding='utf-8', errors='replace') if backend.exists() else ''
          print('::error::real_api_log=' + urllib.parse.quote(text[-18000:]))
          print('::error::real_api_backend_tail=' + urllib.parse.quote(backend_text[-3000:]))
          PY
