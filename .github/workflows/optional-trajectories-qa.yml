name: Optional Trajectories QA
on:
  pull_request:
    paths:
      - "src/impulse/domain/development.py"
      - "src/impulse/application/development.py"
      - "src/impulse/application/development_overview.py"
      - "src/impulse/api/v1/development.py"
      - "frontend/src/features/trajectory-v2/**"
      - "frontend/src/api/client.ts"
      - "tests/test_development_domain.py"
      - "tests/test_development_api.py"
      - "frontend/e2e/trajectory-optional-lifecycle.spec.ts"
      - "src/impulse/bootcamp/editorial_learning.py"
      - ".github/workflows/optional-trajectories-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optional-tracks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a
      - name: Python backend policy and API tests
        run: |
          uv sync --frozen
          uv run ruff check src/impulse/domain/development.py src/impulse/application/development.py src/impulse/application/development_overview.py src/impulse/api/v1/development.py tests/test_development_domain.py tests/test_development_api.py
          uv run pytest -q tests/test_development_domain.py tests/test_development_api.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend lint, typecheck and role-path tests
        working-directory: frontend
        run: |
          npx eslint src/features/trajectory-v2/page.tsx src/features/trajectory-v2/page.test.tsx src/features/trajectory-v2/client.ts src/features/trajectory-v2/role-state.ts src/api/client.ts --max-warnings 0
          npm run typecheck
          npx vitest run src/features/trajectory-v2/page.test.tsx src/features/trajectory-v2/actions.test.tsx
          npm run build
  optional-journey-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npx eslint e2e/trajectory-optional-lifecycle.spec.ts --max-warnings 0
      - run: npx playwright install --with-deps chromium
      - name: Grey to optional, course, grey and restore
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test trajectory-optional-lifecycle.spec.ts --project=chromium --reporter=line
