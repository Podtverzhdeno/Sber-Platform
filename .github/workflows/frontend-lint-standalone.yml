name: Frontend lint standalone gate
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/e2e/**"
      - "frontend/eslint.config.*"
      - ".github/workflows/frontend-lint-standalone.yml"
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/e2e/**"
      - "frontend/eslint.config.*"
      - ".github/workflows/frontend-lint-standalone.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eslint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
