name: Messages database QA

on:
  push:
    branches: [main]
    paths:
      - "src/impulse/application/identity.py"
      - "src/impulse/application/messaging.py"
      - "src/impulse/api/v1/identity.py"
      - "src/impulse/api/v1/messaging.py"
      - "src/impulse/bootstrap/demo_seed.py"
      - "src/impulse/infrastructure/messaging_store.py"
      - "frontend/src/api/client.ts"
      - "tests/test_messaging_api.py"
      - "tests/test_demo_seed_graph.py"
      - "tests/test_identity_access.py"
      - ".github/workflows/messages-database-qa.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: messages-db-${{ github.sha }}
  cancel-in-progress: false

jobs:
  messaging-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulse
          POSTGRES_USER: impulse
          POSTGRES_PASSWORD: impulse-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U impulse -d impulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      TEST_DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff format --check src/impulse/application/identity.py src/impulse/application/messaging.py src/impulse/api/v1/identity.py src/impulse/api/v1/messaging.py src/impulse/bootstrap/demo_seed.py tests/test_messaging_api.py
      - run: uv run ruff check src/impulse/application/identity.py src/impulse/application/messaging.py src/impulse/api/v1/identity.py src/impulse/api/v1/messaging.py src/impulse/bootstrap/demo_seed.py tests/test_messaging_api.py
      - run: uv run alembic upgrade head
      - run: uv run impulse-demo-seed
        env:
          DEMO_MODE: "true"
      - run: uv run pytest -q tests/test_messaging_api.py tests/test_notifications_api.py tests/test_identity_access.py tests/test_demo_seed_graph.py tests/integration/test_demo_seed_idempotency.py
