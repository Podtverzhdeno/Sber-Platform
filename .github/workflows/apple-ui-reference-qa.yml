name: Apple UI kit reference QA

on:
  pull_request:
    paths:
      - "Apple UI kit/**"
      - ".github/workflows/apple-ui-reference-qa.yml"
  push:
    branches: [main]
    paths:
      - "Apple UI kit/**"
      - ".github/workflows/apple-ui-reference-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate docs, manifest, links and JS syntax
        run: node "Apple UI kit/04-web-reference/verify-library.mjs"
      - name: Validate original SVG board XML and provenance
        run: python3 "Apple UI kit/04-web-reference/validate-svg-library.py"
      - name: Validate 10 advanced light/dark SVG pairs
        run: python3 "Apple UI kit/advanced-cases/validate-advanced.py"
      - name: Validate isolated 9-family component and measurement pack
        run: node "Apple UI kit/08-component-packs/verify.mjs"
      - name: Validate 13 source-atlas categories and original SVGs
        run: python3 "Apple UI kit/scripts/verify_reference_pack.py"
      - name: Audit source catalogue, component provenance and redistributable files
        run: python3 "Apple UI kit/scripts/audit_source_bundle.py"
      - name: Audit local reference hyperlinks
        run: python3 "Apple UI kit/scripts/audit_reference_links.py"
      - name: Validate IMPULSE source crosswalk (SHA drift reported as warnings)
        run: python3 "Apple UI kit/scripts/verify_impulse_crosswalk.py"
      - name: Run source atlas synthetic unit tests
        run: python3 -m unittest discover -s "Apple UI kit/scripts" -p "test_*.py" -v
      - name: Validate React reference files and boundaries
        run: node "Apple UI kit/react-reference/verify.mjs"
      - name: Check 46 Apple HIG capture cases, manifest and real IMPULSE file candidates
        run: python3 "Apple UI kit/14-precision-capture-46/verify.py"
      - name: Test offline screenshot comparator math and safety limits
        run: node "Apple UI kit/14-precision-capture-46/test_pixel_compare.cjs"
      - name: Explain scope of checks
        run: |
          echo "Structural reference QA only."
          echo "No Apple UI Kit files redistributed and no pixel-perfect parity claimed."
          echo "Browser rendering and Apple Figma/Sketch layer verification require a separate review."
