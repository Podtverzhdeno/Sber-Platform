name: Temporary approved task geometry QA
on:
  push:
    branches:
      - codex/task-catalog-visual-fidelity-qa-20261024
    paths:
      - .github/workflows/task-catalog-geometry-ci-20261024.yml
permissions:
  contents: read
jobs:
  approved-task-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install frontend
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Source-volume layout checks
        env:
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: npx playwright test e2e/task-catalog-approved-geometry.spec.ts --workers=1 --reporter=line
      - name: Browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-task-geometry-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
