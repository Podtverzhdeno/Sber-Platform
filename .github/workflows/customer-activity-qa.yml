name: Customer Activity Squares QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/customer-analytics.tsx"
      - "frontend/src/features/customer-analytics.scss"
      - "frontend/src/features/customer-analytics.test.tsx"
      - "frontend/e2e/customer-activity-squares.spec.ts"
      - ".github/workflows/customer-activity-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-activity-${{ github.sha }}
  cancel-in-progress: false

jobs:
  customer-activity:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Verify customer activity unit cases
        run: npx vitest run src/features/customer-analytics.test.tsx
      - name: Verify TypeScript for all frontend
        run: npm run typecheck
      - name: Verify customer code and tests
        run: npx eslint src/features/customer-analytics.tsx src/features/customer-analytics.test.tsx e2e/customer-activity-squares.spec.ts --max-warnings 0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify small squares, tooltip and details
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test customer-activity-squares.spec.ts --project=chromium --reporter=line
      - name: Save browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: customer-activity-squares-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
