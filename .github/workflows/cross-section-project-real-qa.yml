name: Project contribution real PostgreSQL browser QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/e2e/cross-section-project-real-api.spec.ts"
      - "src/impulse/api/security.py"
      - ".github/workflows/cross-section-project-real-qa.yml"
  pull_request:
    paths:
      - "frontend/e2e/cross-section-project-real-api.spec.ts"
      - ".github/workflows/cross-section-project-real-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xs-project-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulse
          POSTGRES_USER: impulse
          POSTGRES_PASSWORD: impulse-cross-screen-ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U impulse -d impulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://impulse:impulse-cross-screen-ci@127.0.0.1:5432/impulse
      APP_ENV: test
      CI: "true"
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked backend
        run: uv sync --frozen
      - name: Apply PostgreSQL migrations
        run: uv run alembic upgrade head
      - name: Seed demo personas and courses
        run: uv run impulse-demo-seed
      - name: Start real backend
        run: |
          nohup uv run uvicorn impulse.main:app --host 127.0.0.1 --port 8000 --app-dir . > /tmp/xs-backend.log 2>&1 &
          echo $! > /tmp/xs-backend.pid
      - name: Require ready API before browser tests
        run: |
          for attempt in $(seq 1 40); do
            if curl --silent --fail --max-time 5 http://127.0.0.1:8000/health/ready > /dev/null; then
              echo "Ready on attempt $attempt"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend unavailable; refusing browser-only fixture fallback"
          cat /tmp/xs-backend.log | tail -80
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend
        working-directory: frontend
        run: npm ci
      - name: Verify real E2E lint and TypeScript
        working-directory: frontend
        run: |
          npx eslint e2e/cross-section-project-real-api.spec.ts --max-warnings 0
          npm run typecheck
      - name: Install chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify task publication through accepted project, portfolio, passport and Buddy
        working-directory: frontend
        run: npx playwright test cross-section-project-real-api.spec.ts --project=chromium --reporter=line
      - name: Save failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: project-acceptance-real-browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Print API errors when verification fails
        if: failure()
        run: tail -100 /tmp/xs-backend.log || true
