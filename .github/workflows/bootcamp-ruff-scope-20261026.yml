name: Format Bootcamp Python scope on feature branch
on:
  push:
    branches:
      - fix/bootcamp-ruff-format-20261026
    paths:
      - ".github/workflows/bootcamp-ruff-scope-20261026.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Format exactly four pre-existing CI violations
        run: |
          uv run ruff format src/impulse/bootcamp/editorial_learning.py src/impulse/bootcamp/impulse_levels.py tests/bootcamp/test_impulse_role_level_cycles.py tests/bootcamp/test_impulse_role_levels.py
          uv run ruff format --check src/impulse/bootcamp/editorial_learning.py src/impulse/bootcamp/impulse_levels.py tests/bootcamp/test_impulse_role_level_cycles.py tests/bootcamp/test_impulse_role_levels.py
      - name: Publish formatting-only changes to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/impulse/bootcamp/editorial_learning.py src/impulse/bootcamp/impulse_levels.py tests/bootcamp/test_impulse_role_level_cycles.py tests/bootcamp/test_impulse_role_levels.py
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style(bootcamp): satisfy Ruff format without logic changes"
            git push origin HEAD:fix/bootcamp-ruff-format-20261026
          fi
