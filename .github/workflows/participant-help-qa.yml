name: Participant Help QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/participant-guide*"
      - "frontend/src/features/participant-help*"
      - "frontend/src/features/participant-tour-steps.ts"
      - "frontend/e2e/participant-guide-reference.spec.ts"
      - ".github/workflows/participant-help-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guided-help:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint participant help in isolation
        run: npx eslint src/features/participant-guide.tsx src/features/participant-tour-steps.ts src/features/participant-guide-data.ts src/features/participant-help-content.ts src/features/participant-help-center.tsx src/features/participant-help-trigger.tsx src/features/participant-guide.test.tsx src/features/participant-help-center.test.tsx --max-warnings 0
      - name: Unit test guide policies, popup actions and instructional content
        run: npx vitest run src/features/participant-guide.test.tsx src/features/participant-help-center.test.tsx --reporter=verbose
      - name: Production TypeScript and bundle
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check welcome, spotlight and mobile placement
        run: npx playwright test e2e/participant-guide-reference.spec.ts --project=chromium --reporter=line
        env:
          CI: "true"
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: participant-help-qa-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
