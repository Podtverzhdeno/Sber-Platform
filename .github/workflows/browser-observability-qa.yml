name: Browser Observability QA
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/e2e/observability.spec.ts"
      - "frontend/e2e/support/diagnostics.ts"
      - ".github/workflows/browser-observability-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Run observability and redaction scenarios
        env:
          CI: "true"
        run: npx playwright test observability.spec.ts --project=chromium --reporter=line
      - name: Upload failure traces and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-observability-diagnostics
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
