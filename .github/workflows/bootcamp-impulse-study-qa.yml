name: Bootcamp Impulse Study QA

on:
  push:
    branches: [main]
    paths:
      - "src/impulse/bootcamp/editorial_learning.py"
      - "src/impulse/api/v1/__init__.py"
      - "migrations/versions/20261025_0029_impulse_course_progress.py"
      - "migrations/versions/20261025_0030_impulse_practical_submissions.py"
      - "migrations/versions/20261025_0031_impulse_practice_review.py"
      - "tests/bootcamp/test_impulse_study.py"
      - ".github/workflows/bootcamp-impulse-study-qa.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: impulse-study-${{ github.sha }}
  cancel-in-progress: false

jobs:
  study-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulse
          POSTGRES_USER: impulse
          POSTGRES_PASSWORD: impulse-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U impulse -d impulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      TEST_DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Validate formatting and lint
        run: |
          uv run ruff format --check src/impulse/bootcamp/editorial_learning.py migrations/versions/20261025_0029_impulse_course_progress.py migrations/versions/20261025_0030_impulse_practical_submissions.py migrations/versions/20261025_0031_impulse_practice_review.py
          uv run ruff check src/impulse/bootcamp/editorial_learning.py migrations/versions/20261025_0029_impulse_course_progress.py migrations/versions/20261025_0030_impulse_practical_submissions.py migrations/versions/20261025_0031_impulse_practice_review.py tests/bootcamp/test_impulse_study.py
      - name: Type check study contracts
        run: uv run pyright src/impulse/bootcamp/editorial_learning.py
      - name: Apply every migration to fresh PostgreSQL
        run: uv run alembic upgrade head
      - name: Verify Bootcamp API and learner authorization
        run: uv run pytest tests/bootcamp/test_impulse_study.py -q
