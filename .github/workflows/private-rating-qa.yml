name: Private Rating API QA

on:
  push:
    branches: [main]
    paths:
      - "src/impulse/api/v1/recognition.py"
      - "tests/test_private_rating_api.py"
      - ".github/workflows/private-rating-qa.yml"
  pull_request:
    paths:
      - "src/impulse/api/v1/recognition.py"
      - "tests/test_private_rating_api.py"
      - ".github/workflows/private-rating-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-rating-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-rating:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff formatting
        run: uv run ruff format --check src/impulse/api/v1/recognition.py tests/test_private_rating_api.py
      - name: Ruff lint
        run: uv run ruff check src/impulse/api/v1/recognition.py tests/test_private_rating_api.py
      - name: Owner rating and public privacy regression
        run: uv run pytest tests/test_private_rating_api.py tests/test_recognition_api.py -q
