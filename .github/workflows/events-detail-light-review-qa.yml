name: Events detail light theme independent QA

on:
  pull_request:
    paths:
      - "frontend/src/features/participant-events-detail-banner.scss"
      - "frontend/e2e/events-detail-hero-light-20261116.spec.ts"
      - "frontend/playwright.events-detail-hero-20261116.config.mjs"
      - ".github/workflows/events-detail-light-review-qa.yml"
      - ".agents/coordination/claims/QA-EVENTS-DETAIL-REVIEW-GATE-20261116.lock/status.md"
  push:
    branches: [main]
    paths:
      - "frontend/src/features/participant-events-detail-banner.scss"
      - "frontend/e2e/events-detail-hero-light-20261116.spec.ts"
      - ".github/workflows/events-detail-light-review-qa.yml"
      - ".agents/coordination/claims/QA-EVENTS-DETAIL-REVIEW-GATE-20261116.lock/status.md"

permissions:
  contents: read

concurrency:
  group: events-detail-light-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  event-detail-light:
    name: Light detail modal — 320/390/1440, dark isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout tested PR revision
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint scoped tests and check frontend types
        run: |
          npx eslint e2e/events-detail-hero-light-20261116.spec.ts playwright.events-detail-hero-20261116.config.mjs --max-warnings 0
          npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify light detail artwork and preserve dark mode
        run: npx playwright test --config=playwright.events-detail-hero-20261116.config.mjs --project=chromium
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: events-detail-light-review-traces
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
