name: Tasks interactive QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/task-catalog-v2/**"
      - "frontend/e2e/task-catalog-v2-interactions.spec.ts"
      - "frontend/e2e/task-catalog-approved-geometry.spec.ts"
      - "frontend/e2e/task-catalog-approved-visual-fixture.ts"
      - ".github/workflows/task-catalog-qa.yml"
      - "src/impulse/api/v1/task_catalog.py"
      - "src/impulse/application/task_catalog_page.py"
      - "tests/task_catalog/test_catalog_page_contract.py"
      - "tests/test_task_catalog_api.py"
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a test of a specific commit when unrelated sections are updated.
concurrency:
  group: tasks-ui-qa-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tasks-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate Task Catalog lint
        run: npx eslint src/features/task-catalog-v2 e2e/task-catalog-v2-interactions.spec.ts e2e/task-catalog-approved-geometry.spec.ts e2e/task-catalog-approved-visual-fixture.ts --max-warnings 0
      - name: Run Tasks unit tests
        run: npx vitest run src/features/task-catalog-v2
      - name: Build production frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise actual Tasks controls
        env:
          CI: "true"
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: npx playwright test task-catalog-v2-interactions.spec.ts --project=chromium --reporter=line
      - name: Verify approved Tasks geometry at reference viewport
        env:
          CI: "true"
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
          CAPTURE_APPROVED_TASKS: "1"
        run: npx playwright test task-catalog-approved-geometry.spec.ts --project=chromium --reporter=line
      - name: Upload Tasks visual and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasks-ui-qa-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  tasks-backend-filters:
    name: Tasks API filtering and pagination
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python and uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install pinned backend dependencies
        run: uv sync --frozen
      - name: Exercise real API filters and cursor contracts
        run: uv run pytest -q tests/task_catalog/test_catalog_page_contract.py tests/test_task_catalog_api.py tests/task_catalog/test_visibility_contract.py
