name: Shared learning progress light theme QA

on:
  pull_request:
    paths:
      - "frontend/src/features/learning-progress-panel.scss"
      - "frontend/e2e/learning-progress-light-20261116.spec.ts"
      - "frontend/playwright.learning-progress-light-20261116.config.mjs"
      - ".github/workflows/learning-progress-light-20261116-qa.yml"
      - ".agents/coordination/claims/FIX-LEARNING-PROGRESS-SHARED-LIGHT-20261116.lock/status.md"
  push:
    branches: [main]
    paths:
      - "frontend/src/features/learning-progress-panel.scss"
      - "frontend/e2e/learning-progress-light-20261116.spec.ts"
      - ".github/workflows/learning-progress-light-20261116-qa.yml"

permissions:
  contents: read

jobs:
  shared-learning-light:
    name: Analytics learning — light 320/390/1440 and midnight unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint and typecheck
        run: |
          npx eslint e2e/learning-progress-light-20261116.spec.ts playwright.learning-progress-light-20261116.config.mjs --max-warnings 0
          npm run typecheck
      - name: Production frontend build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify theme surfaces and populated study content
        run: npx playwright test --config=playwright.learning-progress-light-20261116.config.mjs --project=chromium
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-learning-light-qa
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
