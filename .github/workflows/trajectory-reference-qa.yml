name: Trajectory reference QA

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/features/trajectory-v2/**"
      - "frontend/e2e/trajectory-v2-route.spec.ts"
      - "frontend/e2e/trajectory-reference-geometry.spec.ts"
      - ".github/workflows/trajectory-reference-qa.yml"
  push:
    branches: [main]
    paths:
      - "frontend/src/features/trajectory-v2/**"
      - "frontend/e2e/trajectory-v2-route.spec.ts"
      - ".github/workflows/trajectory-reference-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

# Independent of the high-volume main CI. Keep the check tied to its exact SHA.
concurrency:
  group: trajectory-reference-${{ github.sha }}
  cancel-in-progress: false

jobs:
  trajectory-browser:
    name: trajectory-reference-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify approved trajectory interactions and layout
        run: npx playwright test trajectory-v2-route.spec.ts trajectory-reference-geometry.spec.ts --project=chromium
        env:
          CI: "true"
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
      - name: Save trajectory screenshots and browser traces
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trajectory-reference-candidates
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7
