name: Customer SberChat PR Regression
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/e2e/customer-visual.spec.ts"
      - "frontend/src/features/collaboration.tsx"
      - "frontend/src/features/messenger/**"
      - ".github/workflows/customer-sberchat-pr-regression.yml"
  push:
    branches: [main]
    paths:
      - "frontend/e2e/customer-visual.spec.ts"
      - ".github/workflows/customer-sberchat-pr-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-messages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Verify task chat send, separate histories and task context
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: >-
          npx playwright test customer-visual.spec.ts --project=chromium --reporter=line
          --grep "customer can send messages|customer participant dialogs keep separate histories|customer messages expose the linked work context"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: customer-messenger-evidence
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
