name: Messages reference QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/collaboration*"
      - "frontend/src/features/messenger/**"
      - "frontend/public/messages-reference/**"
      - "frontend/e2e/messages-reference.spec.ts"
      - "frontend/tsconfig.messages.json"
      - ".github/workflows/messages-reference-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: messages-reference-qa-${{ github.sha }}
  cancel-in-progress: false

jobs:
  reference-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Lint messenger and browser tests
        run: npx eslint src/features/collaboration.tsx src/features/messenger e2e/messages-reference.spec.ts --max-warnings 0
      - name: Test API-driven messaging interactions
        run: npx vitest run src/features/collaboration.test.tsx src/features/messenger
      - name: Build Vite production bundle (typecheck follows browser acceptance)
        run: npx vite build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify reference views, geometry and clickable actions
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test messages-reference.spec.ts --project=chromium --reporter=line
      - name: Strict TypeScript check for messages and imported API contracts
        run: npx tsc -p tsconfig.messages.json --noEmit --pretty false
      - name: Retain failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: messages-reference-failure-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
