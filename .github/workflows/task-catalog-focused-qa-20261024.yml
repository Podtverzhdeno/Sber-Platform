name: Temporary task catalog focused QA
on:
  push:
    branches:
      - codex/task-catalog-visual-polish-20261024
    paths:
      - .github/workflows/task-catalog-focused-qa-20261024.yml
permissions:
  contents: read
jobs:
  task-catalog-geometry-a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Source-volume geometry and axe checks
        env:
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: npx playwright test e2e/task-catalog-approved-geometry.spec.ts e2e/task-catalog-v2.spec.ts --grep "approved|automated accessibility|light theme" --workers=1 --reporter=line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: task-catalog-geometry-a11y-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
