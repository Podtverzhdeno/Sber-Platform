name: Impulse Practice Credit Integration QA
on:
  pull_request:
    paths:
      - "src/impulse/bootcamp/editorial_learning.py"
      - "src/impulse/bootcamp/impulse_levels.py"
      - "tests/bootcamp/test_impulse_study.py"
      - "tests/bootcamp/test_impulse_role_levels.py"
      - "tests/bootcamp/test_impulse_role_level_cycles.py"
      - "frontend/src/features/impulse-role-level.ts"
      - "frontend/src/features/learning-progress.ts"
      - "frontend/src/features/analytics-v3/page.tsx"
      - "frontend/src/features/bootcamp/catalog.tsx"
      - "frontend/src/features/bootcamp/learning-content/ImmersiveCourseExperience.tsx"
      - "frontend/src/features/trajectory-v2/page.tsx"
      - ".github/workflows/impulse-practice-credit-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulse
          POSTGRES_USER: impulse
          POSTGRES_PASSWORD: impulse-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U impulse -d impulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Check Python formatting and lint
        run: |
          uv run ruff format --check src/impulse/bootcamp/editorial_learning.py src/impulse/bootcamp/impulse_levels.py tests/bootcamp/test_impulse_study.py tests/bootcamp/test_impulse_role_levels.py tests/bootcamp/test_impulse_role_level_cycles.py
          uv run ruff check src/impulse/bootcamp/editorial_learning.py src/impulse/bootcamp/impulse_levels.py tests/bootcamp/test_impulse_study.py tests/bootcamp/test_impulse_role_levels.py tests/bootcamp/test_impulse_role_level_cycles.py
      - name: Migrate PostgreSQL
        run: uv run alembic upgrade head
      - name: Practice submission and role cycle regression
        run: uv run pytest -q tests/bootcamp/test_impulse_study.py tests/bootcamp/test_impulse_role_levels.py tests/bootcamp/test_impulse_role_level_cycles.py

  frontend-projections:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint affected consumer screens
        run: npx eslint src/features/impulse-role-level.ts src/features/learning-progress.ts src/features/analytics-v3/page.tsx src/features/bootcamp/catalog.tsx src/features/bootcamp/learning-content/ImmersiveCourseExperience.tsx src/features/trajectory-v2/page.tsx --max-warnings 0
      - name: Typecheck
        run: npm run typecheck
      - name: Existing synchronized learning UI tests
        run: npx vitest run src/features/bootcamp/role-study-progression.test.ts src/features/trajectory-v2/study-progress.test.ts
