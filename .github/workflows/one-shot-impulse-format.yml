name: One-shot Impulse level formatting
on:
  push:
    paths:
      - ".github/workflows/one-shot-impulse-format.yml"
permissions:
  contents: write
jobs:
  format-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Ruff format touched Python modules
        run: |
          uv run ruff format \
            migrations/versions/20261025_0034_impulse_role_levels.py \
            src/impulse/bootcamp/impulse_levels.py \
            tests/bootcamp/test_impulse_role_levels.py \
            src/impulse/application/career_grade_transition.py \
            tests/test_career_grade_transition.py
      - name: Regenerate versioned OpenAPI contract
        run: uv run python -m impulse.quality.openapi_contract
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git add migrations/versions/20261025_0034_impulse_role_levels.py \
            src/impulse/bootcamp/impulse_levels.py \
            tests/bootcamp/test_impulse_role_levels.py \
            src/impulse/application/career_grade_transition.py \
            tests/test_career_grade_transition.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(impulse): Ruff-format learning level state and transition tests"
          git pull --rebase origin main
          git push origin HEAD:main
