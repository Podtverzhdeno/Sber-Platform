name: Trajectory AI Roles QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/trajectory-v2/source-reference/source-catalog.ts"
      - "frontend/src/features/trajectory-v2/source-reference/source-catalog.test.ts"
      - "frontend/src/features/trajectory-v2/page.tsx"
      - "frontend/src/features/trajectory-v2/page.test.tsx"
      - "frontend/e2e/trajectory-source-route.spec.ts"
      - "migrations/versions/20261025_0028_ai_demo_roles.py"
      - "tests/test_ai_role_catalog_migration.py"
      - ".github/workflows/trajectory-ai-roles-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-role-title-qa-${{ github.sha }}
  cancel-in-progress: false

jobs:
  demo-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Check demo-only data migration
        run: |
          uv run ruff check migrations/versions/20261025_0028_ai_demo_roles.py tests/test_ai_role_catalog_migration.py
          uv run ruff format --check migrations/versions/20261025_0028_ai_demo_roles.py tests/test_ai_role_catalog_migration.py
          uv run pytest -q tests/test_ai_role_catalog_migration.py tests/test_demo_seed_graph.py

  frontend-role-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Lint AI role surface
        run: npx eslint src/features/trajectory-v2/source-reference/source-catalog.ts src/features/trajectory-v2/source-reference/source-catalog.test.ts src/features/trajectory-v2/page.tsx src/features/trajectory-v2/page.test.tsx e2e/trajectory-source-route.spec.ts --max-warnings 0
      - name: Test canonical titles, states and route selection
        run: npx vitest run src/features/trajectory-v2/source-reference/source-catalog.test.ts src/features/trajectory-v2/page.test.tsx

  browser-role-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify all seven AI role cards in browser
        run: npx playwright test trajectory-source-route.spec.ts --project=chromium
        env:
          CI: "true"
          TZ: Europe/Moscow
