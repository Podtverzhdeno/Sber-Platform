name: Bootcamp Catalog Unit QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/bootcamp/catalog.tsx"
      - "frontend/src/features/bootcamp/catalog.test.tsx"
      - "frontend/src/features/bootcamp/trajectory-content.ts"
      - ".github/workflows/bootcamp-catalog-unit-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Check redesigned catalog URL, selection, permission and modal states
        run: npx vitest run src/features/bootcamp/catalog.test.tsx --reporter=verbose
