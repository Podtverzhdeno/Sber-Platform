name: Shared sidebar QA

on:
  pull_request:
    paths:
      - "frontend/src/App.tsx"
      - "frontend/src/styles.scss"
      - "frontend/src/features/analytics-reference.scss"
      - "frontend/src/features/messenger/reference.scss"
      - "frontend/e2e/sidebar-consistency.spec.ts"
      - "frontend/e2e/messages-reference.spec.ts"
      - "frontend/e2e/analytics-reference.spec.ts"
      - ".github/workflows/sidebar-consistency-qa.yml"
  push:
    branches: [main]
    paths:
      - "frontend/src/App.tsx"
      - "frontend/src/styles.scss"
      - "frontend/src/features/analytics-reference.scss"
      - "frontend/src/features/messenger/reference.scss"
      - "frontend/e2e/sidebar-consistency.spec.ts"
      - "frontend/e2e/messages-reference.spec.ts"
      - "frontend/e2e/analytics-reference.spec.ts"
      - ".github/workflows/sidebar-consistency-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidebar-qa-${{ github.sha }}
  cancel-in-progress: false

jobs:
  browser-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked packages
        run: npm ci
      - name: Lint sidebar regression test
        run: npx eslint e2e/sidebar-consistency.spec.ts --max-warnings 0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify shared sidebar, chat geometry and analytics viewports
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test sidebar-consistency.spec.ts messages-reference.spec.ts analytics-reference.spec.ts --project=chromium --reporter=line
      - name: Archive screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sidebar-consistency-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
