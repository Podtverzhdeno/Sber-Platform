name: Five-section mobile independent review QA

on:
  pull_request:
    paths:
      - "frontend/e2e/five-section-theme-mobile-20261116.spec.ts"
      - ".github/workflows/five-section-mobile-review-qa.yml"
  push:
    branches: [main]
    paths:
      - "frontend/e2e/five-section-theme-mobile-20261116.spec.ts"
      - ".github/workflows/five-section-mobile-review-qa.yml"

permissions:
  contents: read

jobs:
  mobile-five-sections:
    name: Five groups — 320/390/1440 and three themes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint and TypeScript
        run: |
          npm run lint
          npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify all five groups across three themes
        run: npx playwright test e2e/five-section-theme-mobile-20261116.spec.ts --project=chromium --workers=1
      - name: Upload failed traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: five-section-mobile-review-traces
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
