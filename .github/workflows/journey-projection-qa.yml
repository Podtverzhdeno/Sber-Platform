name: Joined Journey Projection QA

on:
  push:
    branches: [main]
    paths:
      - "src/impulse/api/v1/journey.py"
      - "src/impulse/api/v1/__init__.py"
      - "tests/test_journey_projection.py"
      - ".github/workflows/journey-projection-qa.yml"
  pull_request:
    paths:
      - "src/impulse/api/v1/journey.py"
      - "src/impulse/api/v1/__init__.py"
      - "tests/test_journey_projection.py"
      - ".github/workflows/journey-projection-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journey-projection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  joined-evidence-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install pinned Python dependencies
        run: uv sync --frozen
      - name: Check formatting
        run: uv run ruff format --check src/impulse/api/v1/journey.py src/impulse/api/v1/__init__.py tests/test_journey_projection.py
      - name: Check lint
        run: uv run ruff check src/impulse/api/v1/journey.py src/impulse/api/v1/__init__.py tests/test_journey_projection.py
      - name: Verify self-study, role, projects and rating projections
        run: uv run pytest tests/test_journey_projection.py -q
