name: Bootcamp Role Progression QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/bootcamp/catalog.tsx"
      - "frontend/src/features/bootcamp/grade-milestone-celebration.tsx"
      - "frontend/src/features/bootcamp/grade-milestone-celebration.scss"
      - "frontend/src/features/bootcamp/learning-content/ImmersiveCourseExperience.tsx"
      - "frontend/src/features/bootcamp/role-study-progression*"
      - "frontend/e2e/bootcamp-role-progression.spec.ts"
      - "frontend/e2e/bootcamp-reference-fixtures.ts"
      - ".github/workflows/bootcamp-role-progression-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootcamp-role-progression-${{ github.sha }}
  cancel-in-progress: false

jobs:
  completion-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Lint role projection
        run: npx eslint src/features/bootcamp/catalog.tsx src/features/bootcamp/role-study-progression.ts src/features/bootcamp/role-study-progression.test.ts e2e/bootcamp-role-progression.spec.ts --max-warnings 0
      - name: Unit checks for study evidence
        run: npx vitest run src/features/bootcamp/role-study-progression.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify course to role progression in browser
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test bootcamp-role-progression.spec.ts --project=chromium --reporter=line
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Save browser screenshots and error traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootcamp-role-progression-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
