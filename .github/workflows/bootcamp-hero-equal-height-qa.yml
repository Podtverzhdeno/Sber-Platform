name: Bootcamp Hero Alignment QA
on:
  pull_request:
    paths:
      - "frontend/src/features/bootcamp/reference-fidelity.scss"
      - "frontend/e2e/bootcamp-layout-alignment.spec.ts"
      - ".github/workflows/bootcamp-hero-equal-height-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Lint and typecheck
        run: |
          npx eslint e2e/bootcamp-layout-alignment.spec.ts --max-warnings 0
          npm run typecheck
      - name: Build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser geometry on desktop, tablet and mobile
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test bootcamp-layout-alignment.spec.ts --project=chromium --reporter=line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bootcamp-equal-height-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
