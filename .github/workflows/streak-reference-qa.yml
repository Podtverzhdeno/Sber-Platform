name: Streak reference QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/engagement.tsx"
      - "frontend/src/features/engagement.scss"
      - "frontend/src/features/engagement.test.tsx"
      - "frontend/src/App.tsx"
      - "frontend/e2e/streak-reference-geometry.spec.ts"
      - "frontend/e2e/theme.spec.ts"
      - "frontend/public/streak-reference/**"
      - ".github/workflows/streak-reference-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streak-reference-qa-${{ github.sha }}
  cancel-in-progress: false

jobs:
  streak-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Check changed streak implementation and E2E lint
        run: npx eslint src/features/engagement.tsx src/features/engagement.test.tsx e2e/streak-reference-geometry.spec.ts e2e/theme.spec.ts --max-warnings 0
      - name: Unit-test streak states, freeze, calendar and rhythm
        run: npx vitest run src/features/engagement.test.tsx
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile geometry
        env:
          CI: "true"
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: npx playwright test streak-reference-geometry.spec.ts theme.spec.ts --project=chromium --reporter=line
      - name: Keep screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: streak-geometry-evidence
          path: |
            frontend/test-results/streak-reference-*.png
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
