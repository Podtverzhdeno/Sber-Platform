name: Messenger Journey PR QA
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/e2e/messenger-journeys.customer.spec.ts"
      - "frontend/e2e/messenger-journeys.participant.spec.ts"
      - "frontend/src/features/messenger/**"
      - "frontend/src/features/collaboration.tsx"
      - ".github/workflows/messenger-journey-pr-qa.yml"
  push:
    branches: [main]
    paths:
      - "frontend/e2e/messenger-journeys.customer.spec.ts"
      - "frontend/e2e/messenger-journeys.participant.spec.ts"
      - ".github/workflows/messenger-journey-pr-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Verify participant and customer messaging flows
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test messenger-journeys.customer.spec.ts messenger-journeys.participant.spec.ts --project=chromium --reporter=line
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: messenger-pr-journey-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
