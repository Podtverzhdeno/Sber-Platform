name: Activity Calendar QA

on:
  pull_request:
    paths:
      - "frontend/src/features/activity-calendar/**"
      - "frontend/src/features/analytics-v3/page.tsx"
      - "frontend/e2e/analytics-premium.spec.ts"
      - "frontend/e2e/analytics-three-sections.spec.ts"
      - ".github/workflows/activity-calendar-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Lint changed frontend files
        run: npx eslint src/features/activity-calendar/calendar.tsx src/features/activity-calendar/calendar.test.tsx src/features/analytics-v3/page.tsx e2e/analytics-premium.spec.ts e2e/analytics-three-sections.spec.ts --max-warnings 0
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run src/features/activity-calendar/calendar.test.tsx
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser QA desktop and mobile
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test analytics-premium.spec.ts analytics-three-sections.spec.ts --project=chromium --reporter=line
      - name: Upload screenshot and trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: activity-calendar-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
