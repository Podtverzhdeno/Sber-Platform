name: Home reference QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/participant-home-v2/**"
      - "frontend/src/App.tsx"
      - "frontend/public/home-reference/**"
      - "frontend/e2e/home-reference-geometry.spec.ts"
      - "frontend/e2e/home-v2-route.spec.ts"
      - ".github/workflows/home-reference-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

# A check for a specific reference implementation must not be cancelled by
# unrelated commits to Tasks or Trajectory that arrive during Playwright.
concurrency:
  group: home-reference-qa-${{ github.sha }}
  cancel-in-progress: false

jobs:
  reference-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Verify unmodified approved SVG art from ZIP
        run: |
          printf '%s  %s\n' \
            '4a5cb57d6101ca6d19abbdfd8da673ed25327061c2378307a0a5ed3439718ad2' 'public/home-reference/buddy.svg' \
            '21d3ff561877ded359d3ec1be8f08d549451223a9b1d2fdec8a84d0005e4261e' 'public/home-reference/mountain-path.svg' | sha256sum -c -
      - name: Check home lint and its browser tests
        run: npx eslint src/features/participant-home-v2 e2e/home-reference-geometry.spec.ts e2e/home-v2-route.spec.ts --max-warnings 0
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Test the new home React states
        run: npx vitest run src/features/participant-home-v2/page.test.tsx
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify desktop/mobile screenshot geometry and navigation
        env:
          CI: "true"
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: npx playwright test home-reference-geometry.spec.ts home-v2-route.spec.ts --project=chromium --reporter=line
      - name: Retain failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: home-reference-failure-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
