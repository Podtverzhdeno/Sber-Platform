name: Cross-section six-role privacy browser QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/e2e/cross-section-role-privacy.spec.ts"
      - ".github/workflows/cross-section-role-privacy-qa.yml"
  pull_request:
    paths:
      - "frontend/e2e/cross-section-role-privacy.spec.ts"
      - ".github/workflows/cross-section-role-privacy-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-section-roles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulse
          POSTGRES_USER: impulse
          POSTGRES_PASSWORD: impulse-roles-ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U impulse -d impulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://impulse:impulse-roles-ci@127.0.0.1:5432/impulse
      APP_ENV: test
      CI: "true"
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run impulse-demo-seed
      - name: Start real backend
        run: |
          nohup uv run uvicorn impulse.main:app --host 127.0.0.1 --port 8000 --app-dir . > /tmp/roles-backend.log 2>&1 &
          echo $! > /tmp/roles-backend.pid
      - name: Require API readiness
        run: |
          for attempt in $(seq 1 40); do
            if curl --silent --fail --max-time 5 http://127.0.0.1:8000/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/roles-backend.log | tail -80
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Check role test TS and lint
        working-directory: frontend
        run: |
          npx eslint e2e/cross-section-role-privacy.spec.ts --max-warnings 0
          npm run typecheck
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run real six-role authorization and UI navigation test
        working-directory: frontend
        run: npx playwright test cross-section-role-privacy.spec.ts --project=chromium --reporter=line
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-section-six-role-evidence
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Print backend logs on failure
        if: failure()
        run: tail -90 /tmp/roles-backend.log || true
