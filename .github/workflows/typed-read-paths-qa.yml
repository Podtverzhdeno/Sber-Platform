name: Typed Read Paths QA
on:
  pull_request:
    paths:
      - "frontend/src/features/buddy-live-data.ts"
      - "frontend/src/features/journey-evidence.ts"
      - "frontend/src/features/rating-v2/own-standing.ts"
      - ".github/workflows/typed-read-paths-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  type-and-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Strict lint for changed API consumers
        run: npx eslint src/features/buddy-live-data.ts src/features/journey-evidence.ts src/features/rating-v2/own-standing.ts --max-warnings 0
      - name: Full frontend TypeScript check
        run: npm run typecheck
      - name: Read projection and privacy regression tests
        run: npx vitest run src/features/buddy-live-data.test.ts src/features/rating-v2/own-standing.test.ts
