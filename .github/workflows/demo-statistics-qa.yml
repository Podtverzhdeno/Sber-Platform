name: Demo statistics database QA

on:
  push:
    branches: [main]
    paths:
      - "src/impulse/bootstrap/demo_seed.py"
      - "tests/test_demo_seed_graph.py"
      - "tests/integration/test_demo_seed_idempotency.py"
      - "src/impulse/bootstrap/ai_role_catalog.py"
      - "src/impulse/bootstrap/ai_curriculum_details.py"
      - "src/impulse/bootstrap/ai_reading_resources.py"
      - "tests/test_ai_curriculum_details.py"
      - "src/impulse/application/development.py"
      - "src/impulse/api/v1/development.py"
      - ".github/workflows/demo-statistics-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-statistics-${{ github.sha }}
  cancel-in-progress: false

jobs:
  seed-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulse
          POSTGRES_USER: impulse
          POSTGRES_PASSWORD: impulse-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U impulse -d impulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      APP_ENV: test
      DEMO_MODE: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked requirements
        run: uv sync --frozen
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Validate demo graph
        run: uv run pytest -q tests/test_demo_seed_graph.py tests/test_ai_curriculum_details.py tests/task_catalog/test_demo_seed.py
      - name: Reproduce runtime UUID collision without losing participant progress
        run: uv run pytest -q tests/integration/test_demo_seed_idempotency.py
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      - name: Verify idempotent PostgreSQL seed and row counts
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          from sqlalchemy import func, select
          from impulse.infrastructure.database import Database
          from impulse.bootstrap.demo_seed import seed_demo
          from impulse.infrastructure.models.development import tracks, milestones
          from impulse.infrastructure.models.competencies import competency_evidence

          async def main():
              db = Database(os.environ["DATABASE_URL"])
              try:
                  first = await seed_demo(db)
                  second = await seed_demo(db)
                  assert first == second, (first, second)
                  assert second["tracks"] == 7
                  assert second["milestones"] == 49
                  assert second["competency_evidence"] == 5
                  assert second["learning_days"] >= 10
                  async with db.sessions() as session:
                      assert await session.scalar(select(func.count()).select_from(tracks)) == 7
                      assert await session.scalar(select(func.count()).select_from(milestones)) == 49
                      assert await session.scalar(select(func.count()).select_from(competency_evidence)) == 5
                  print("Demo PostgreSQL integrity passed:", second)
              finally:
                  await db.close()

          asyncio.run(main())
          PY
