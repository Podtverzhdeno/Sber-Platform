name: Bootcamp Primary Role Gold QA

on:
  pull_request:
    paths:
      - "frontend/src/features/bootcamp/catalog.tsx"
      - "frontend/src/features/bootcamp/reference-fidelity.scss"
      - "frontend/src/features/bootcamp/trajectory-catalog-ui.test.tsx"
      - "frontend/e2e/bootcamp-primary-role-gold.spec.ts"
      - ".github/workflows/bootcamp-primary-role-gold-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary-role-gold:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci
      - name: Strict lint on changed TypeScript
        run: npx eslint src/features/bootcamp/catalog.tsx src/features/bootcamp/trajectory-catalog-ui.test.tsx e2e/bootcamp-primary-role-gold.spec.ts --max-warnings 0
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and role integration tests
        run: npx vitest run src/features/bootcamp/trajectory-catalog-ui.test.tsx src/features/bootcamp/catalog.test.tsx
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser check golden main career role
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test bootcamp-primary-role-gold.spec.ts --project=chromium --reporter=line
      - name: Save visual proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootcamp-primary-role-gold-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
