name: Trajectory Map Mobile QA
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/e2e/trajectory-map.spec.ts"
      - "frontend/src/features/trajectory-map/**"
      - ".github/workflows/trajectory-map-mobile-qa.yml"
  push:
    branches: [main]
    paths:
      - "frontend/e2e/trajectory-map.spec.ts"
      - ".github/workflows/trajectory-map-mobile-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trajectory-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Test legacy map links and mobile checkpoint access
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test trajectory-map.spec.ts --project=chromium --reporter=line
