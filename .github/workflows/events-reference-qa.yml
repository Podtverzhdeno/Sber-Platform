name: Events Reference QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/participant-events.tsx"
      - "frontend/src/features/participant-events-design.tsx"
      - "frontend/src/features/participant-events.scss"
      - "frontend/src/features/participant-events-reference.scss"
      - "frontend/src/features/participant-events-fidelity.scss"
      - "frontend/src/features/participant-events-compact.scss"
      - "frontend/src/features/participant-events.test.tsx"
      - "frontend/public/events/**"
      - "frontend/src/components/ui.tsx"
      - "frontend/e2e/participant-events.spec.ts"
      - ".github/workflows/events-reference-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: events-reference-${{ github.sha }}
  cancel-in-progress: false

jobs:
  events:
    name: events-seven-state-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout reference implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Bundle browser build
        run: npx vite build
      - name: Strict TypeScript check
        run: npm run typecheck
      - name: Participant events unit tests
        run: npx vitest run src/features/participant-events.test.tsx
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify all Events states and interactions
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test participant-events.spec.ts --project=chromium --reporter=line
      - name: Lint Events implementation and fixtures
        if: always()
        run: npx eslint src/features/participant-events.tsx src/features/participant-events-design.tsx e2e/participant-events.spec.ts --max-warnings 0
      - name: Upload seven UI captures, mobile screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: events-reference-browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
