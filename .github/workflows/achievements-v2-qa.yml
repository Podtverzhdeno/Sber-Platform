name: Achievements V2 QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/achievements-v2/**"
      - "frontend/src/features/participant.tsx"
      - "frontend/e2e/achievements-v2.spec.ts"
      - ".github/workflows/achievements-v2-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: achievements-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  achievements:
    name: achievements-responsive-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npx vite build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify achievements workflow
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test achievements-v2.spec.ts --project=chromium --reporter=line
      - name: Verify lint
        if: always()
        run: npx eslint src/features/achievements-v2/page.tsx src/features/achievements-v2/model.ts e2e/achievements-v2.spec.ts --max-warnings 0
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: achievements-v2-browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
