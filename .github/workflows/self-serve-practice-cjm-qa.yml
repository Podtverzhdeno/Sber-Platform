name: Self-Service Practice CJM QA
on:
  pull_request:
    paths:
      - "migrations/versions/20261026_0035_impulse_practice_choices.py"
      - "src/impulse/bootcamp/editorial_learning.py"
      - "tests/bootcamp/test_impulse_study.py"
      - "frontend/src/features/bootcamp/learning-content/ImmersiveCourseExperience.tsx"
      - "frontend/src/features/trajectory-v2/page.tsx"
      - "frontend/src/features/learning-progress-panel.tsx"
      - "frontend/e2e/bootcamp-immersive.spec.ts"
      - "frontend/e2e/bootcamp-reference-fixtures.ts"
      - ".github/workflows/self-serve-practice-cjm-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulse
          POSTGRES_USER: impulse
          POSTGRES_PASSWORD: impulse-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U impulse -d impulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      TEST_DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check migrations/versions/20261026_0035_impulse_practice_choices.py src/impulse/bootcamp/editorial_learning.py tests/bootcamp/test_impulse_study.py
      - run: uv run ruff format --check migrations/versions/20261026_0035_impulse_practice_choices.py src/impulse/bootcamp/editorial_learning.py tests/bootcamp/test_impulse_study.py
      - name: Migrate clean PostgreSQL schema with practice task column
        run: uv run alembic upgrade head
      - name: Prove persistence, idempotence, reviewer isolation, correct task
        run: uv run pytest -q tests/bootcamp/test_impulse_study.py tests/bootcamp/test_impulse_role_levels.py
      - name: Check API snapshot
        run: uv run pytest -q tests/test_openapi_contract.py
  browser-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Journey from course through choosing, submitting and reopening task
        run: npx playwright test e2e/bootcamp-immersive.spec.ts --project=chromium -g "finished course appears in Analytics and Trajectory"
