name: Format Checkpoint Evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-checkpoint-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned code formatter
        run: python -m pip install ruff==0.16.9
      - name: Format touched backend files
        run: |
          ruff check --select I --fix             src/impulse/api/v1/work.py             src/impulse/infrastructure/work_store.py             migrations/versions/20261025_0032_checkpoint_evidence.py
          ruff format             src/impulse/api/v1/work.py             src/impulse/infrastructure/work_store.py             migrations/versions/20261025_0032_checkpoint_evidence.py
      - name: Commit formatter output if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/impulse/api/v1/work.py src/impulse/infrastructure/work_store.py migrations/versions/20261025_0032_checkpoint_evidence.py
          if ! git diff --cached --quiet; then
            git commit -m "style(projects): Ruff-format checkpoint evidence backend"
            git push origin HEAD:main
          fi
