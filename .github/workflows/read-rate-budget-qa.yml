name: Cross-screen read rate budget QA

on:
  push:
    branches: [main]
    paths:
      - "src/impulse/api/security.py"
      - "tests/test_security_read_budget.py"
      - ".github/workflows/read-rate-budget-qa.yml"
  pull_request:
    paths:
      - "src/impulse/api/security.py"
      - "tests/test_security_read_budget.py"
      - ".github/workflows/read-rate-budget-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-rate-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-buckets:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Verify formatting and lint
        run: |
          uv run ruff format --check src/impulse/api/security.py tests/test_security_read_budget.py
          uv run ruff check src/impulse/api/security.py tests/test_security_read_budget.py
      - name: Verify rate window isolation and real reads
        run: uv run pytest tests/test_security_read_budget.py tests/test_security_controls.py -q
