name: Temporary scoped task catalog quality
on:
  push:
    branches: [codex/task-catalog-visual-polish-20261024]
    paths: [.github/workflows/task-catalog-review-capture.yml]
permissions:
  contents: read
jobs:
  task-catalog-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/task-catalog-visual-polish-20261024
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Lint task catalog only
        run: npx eslint 'src/features/task-catalog-v2/**/*.{ts,tsx}' 'e2e/task-catalog-v2*.spec.ts' --max-warnings 0
      - name: Typecheck
        run: npm run typecheck
      - name: Feature component and matching unit tests
        run: npx vitest run src/features/task-catalog-v2
      - name: Production build
        run: npm run build
      - name: Browser prerequisites
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-liberation fontconfig
          fc-cache -f
      - name: Functional and visual browser regressions
        env:
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: npx playwright test e2e/task-catalog-v2.spec.ts e2e/task-catalog-v2-visual.spec.ts
