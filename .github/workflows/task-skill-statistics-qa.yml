name: Task Skill Evidence Statistics QA
on:
  pull_request:
    paths:
      - "src/impulse/application/task_catalog.py"
      - "src/impulse/application/task_catalog_matching.py"
      - "src/impulse/api/v1/task_catalog.py"
      - "frontend/src/features/task-catalog-v2/**"
      - "frontend/src/api/schema.ts"
      - "openapi.json"
      - "tests/test_task_catalog_matching.py"
      - "tests/task_catalog/test_projection_service.py"
      - ".github/workflows/task-skill-statistics-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff format and lint
        run: |
          uv run ruff format --check src/impulse/application/task_catalog.py src/impulse/application/task_catalog_matching.py src/impulse/api/v1/task_catalog.py tests/test_task_catalog_matching.py
          uv run ruff check src/impulse/application/task_catalog.py src/impulse/application/task_catalog_matching.py src/impulse/api/v1/task_catalog.py tests/test_task_catalog_matching.py
      - name: Show Ruff formatter diff on failure
        if: failure()
        run: uv run ruff format --diff src/impulse/application/task_catalog.py src/impulse/application/task_catalog_matching.py src/impulse/api/v1/task_catalog.py tests/test_task_catalog_matching.py
      - name: Backend task catalog contract and evidence regression
        run: uv run pytest -q tests/test_task_catalog_matching.py tests/task_catalog/test_projection_service.py tests/test_task_catalog_api.py
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: OpenAPI client codegen contract
        run: npm run api:check
      - name: Show generated API type differences on failure
        if: failure()
        run: |
          npm run api:generate
          git diff -- src/api/schema.ts | head -c 12000
      - name: Strict frontend lint
        run: npx eslint src/features/task-catalog-v2/page.tsx src/features/task-catalog-v2/skill-impact-statistics.tsx src/features/task-catalog-v2/skill-impact-statistics.test.tsx --max-warnings 0
      - name: Typecheck
        run: npm run typecheck
      - name: Evidence statistics and existing task-detail tests
        run: npx vitest run src/features/task-catalog-v2/skill-impact-statistics.test.tsx src/features/task-catalog-v2/page.test.tsx
      - name: Production bundle
        run: npx vite build
