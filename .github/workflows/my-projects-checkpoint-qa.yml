name: My Projects Checkpoint QA

on:
  push:
    branches: [main]
    paths:
      - "src/impulse/api/v1/work.py"
      - "src/impulse/application/work.py"
      - "src/impulse/infrastructure/work_store.py"
      - "migrations/versions/20261025_0032_checkpoint_evidence.py"
      - "migrations/versions/20261025_0033_demo_checkpoint_guidance.py"
      - "tests/projects/test_checkpoint_evidence.py"
      - "tests/projects/test_checkpoint_review.py"
      - "src/impulse/bootstrap/demo_seed.py"
      - "frontend/src/features/my-projects/**"
      - "frontend/e2e/my-projects-v2.spec.ts"
      - "frontend/src/api/client.ts"
      - ".github/workflows/my-projects-checkpoint-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-qa-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checkpoint-postgresql:
    name: checkpoint-postgresql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulse
          POSTGRES_USER: impulse
          POSTGRES_PASSWORD: impulse-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U impulse -d impulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      TEST_DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Check Python formatting
        run: uv run ruff format --check src/impulse/api/v1/work.py src/impulse/infrastructure/work_store.py migrations/versions/20261025_0032_checkpoint_evidence.py migrations/versions/20261025_0033_demo_checkpoint_guidance.py tests/projects/test_checkpoint_evidence.py tests/projects/test_checkpoint_review.py
      - name: Check Python lint
        run: uv run ruff check src/impulse/api/v1/work.py src/impulse/infrastructure/work_store.py migrations/versions/20261025_0032_checkpoint_evidence.py migrations/versions/20261025_0033_demo_checkpoint_guidance.py tests/projects/test_checkpoint_evidence.py tests/projects/test_checkpoint_review.py
      - name: Apply all migrations
        run: uv run alembic upgrade head
      - name: Exercise private file persistence and permissions
        run: uv run pytest tests/projects/test_checkpoint_evidence.py tests/projects/test_checkpoint_review.py -q -rs
  checkpoint-browser:
    name: checkpoint-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - name: Lint project checkpoint implementation and browser checks
        run: npx eslint src/features/my-projects src/api/client.ts e2e/my-projects-v2.spec.ts --max-warnings 0
      - run: npx playwright install --with-deps chromium
      - name: Check checkpoint UI and upload actions
        env:
          CI: "true"
          TZ: Europe/Moscow
          LANG: ru_RU.UTF-8
        run: npx playwright test my-projects-v2.spec.ts --project=chromium --reporter=line
      - name: Upload UI evidence and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkpoint-ui-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
