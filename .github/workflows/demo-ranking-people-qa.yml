name: Demo Ranking People QA

on:
  pull_request:
    paths:
      - "src/impulse/bootstrap/demo_seed.py"
      - "tests/test_demo_seed_graph.py"
      - "tests/integration/test_demo_rating_visibility.py"
      - "frontend/src/features/rating-v2/page.tsx"
      - "frontend/src/features/rating-v2/page.test.tsx"
      - "frontend/e2e/participant-interactions.spec.ts"
      - ".github/workflows/demo-ranking-people-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-person-consent:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulse
          POSTGRES_USER: impulse
          POSTGRES_PASSWORD: impulse-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U impulse -d impulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      TEST_DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Migrate isolated CI database
        run: uv run alembic upgrade head
      - name: Ruff source and test quality
        run: |
          uv run ruff format --check src/impulse/bootstrap/demo_seed.py tests/test_demo_seed_graph.py tests/integration/test_demo_rating_visibility.py
          uv run ruff check src/impulse/bootstrap/demo_seed.py tests/test_demo_seed_graph.py tests/integration/test_demo_rating_visibility.py
      - name: Seed privacy, rating and opt-out regression
        run: uv run pytest -q tests/test_demo_seed_graph.py tests/test_recognition_domain.py tests/integration/test_demo_rating_visibility.py

  rating-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Lint only changed UI and browser test
        run: npx eslint src/features/rating-v2/page.tsx src/features/rating-v2/page.test.tsx e2e/participant-interactions.spec.ts --max-warnings 0
      - name: TypeScript
        run: npm run typecheck
      - name: Rating privacy and profile unit tests
        run: npx vitest run src/features/rating-v2/page.test.tsx
      - name: Production build
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Ten distinct fictional participant browser acceptance
        env:
          CI: "true"
          TZ: Europe/Moscow
        run: npx playwright test participant-interactions.spec.ts --project=chromium --grep "rating shows ten distinct consented fictional demo participants" --reporter=line
      - name: Save browser screenshot and trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ranking-ten-people-visual-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
