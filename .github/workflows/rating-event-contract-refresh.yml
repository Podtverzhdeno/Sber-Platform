name: Synchronize rating season API contracts

on:
  push:
    branches: [fix/rating-events-synced-20261025]
    paths:
      - ".github/workflows/rating-event-contract-refresh.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run python -m impulse.quality.openapi_contract
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Generate frontend types
        working-directory: frontend
        run: |
          npm ci
          npm run api:generate
          npm run api:check
      - name: Commit generated contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json frontend/src/api/schema.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(rating): synchronize public seasons OpenAPI contract"
          git pull --rebase origin fix/rating-events-synced-20261025
          git push origin HEAD:fix/rating-events-synced-20261025
