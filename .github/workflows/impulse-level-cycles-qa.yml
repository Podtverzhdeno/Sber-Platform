name: Impulse L0-L3 Cycle QA

on:
  push:
    branches: [main]
    paths:
      - "src/impulse/bootcamp/impulse_levels.py"
      - "src/impulse/bootcamp/editorial_learning.py"
      - "src/impulse/bootstrap/demo_seed.py"
      - "tests/bootcamp/test_impulse_role_levels.py"
      - "tests/bootcamp/test_impulse_role_level_cycles.py"
      - "frontend/src/features/bootcamp/learning-content/advanced-cycle-programs*"
      - "frontend/src/features/bootcamp/role-study-progression*"
      - "frontend/src/features/bootcamp/catalog.tsx"
      - "frontend/src/features/trajectory-v2/page.tsx"
      - "openapi.json"
      - "frontend/src/api/schema.ts"
      - ".github/workflows/impulse-level-cycles-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: impulse-l0-l3-${{ github.sha }}
  cancel-in-progress: false

jobs:
  database-cycles:
    name: PostgreSQL promotion and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulse
          POSTGRES_USER: impulse
          POSTGRES_PASSWORD: impulse-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U impulse -d impulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      TEST_DATABASE_URL: postgresql+asyncpg://impulse:impulse-ci-only@127.0.0.1:5432/impulse
      APP_ENV: test
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Check policy and persistence code
        run: |
          uv run ruff format --check src/impulse/bootcamp/impulse_levels.py src/impulse/bootcamp/editorial_learning.py tests/bootcamp/test_impulse_role_levels.py tests/bootcamp/test_impulse_role_level_cycles.py
          uv run ruff check src/impulse/bootcamp/impulse_levels.py src/impulse/bootcamp/editorial_learning.py tests/bootcamp/test_impulse_role_levels.py tests/bootcamp/test_impulse_role_level_cycles.py
      - name: Apply real database migrations
        run: uv run alembic upgrade head
      - name: Exercise all three real promotions and reject replay
        run: uv run pytest tests/bootcamp/test_impulse_role_levels.py tests/bootcamp/test_impulse_role_level_cycles.py -q
      - name: Confirm published contract matches actual API
        run: uv run python -m impulse.quality.openapi_contract --check

  frontend-cycles:
    name: Advanced learning UI and typed client
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Confirm generated types
        run: npm run api:check
      - name: Unit-test fresh course content and certificates
        run: npx vitest run src/features/bootcamp/learning-content/advanced-cycle-programs.test.ts src/features/bootcamp/role-study-progression.test.ts
      - name: Lint current-cycle user experience
        run: npx eslint src/features/bootcamp/learning-content/advanced-cycle-programs.ts src/features/bootcamp/learning-content/advanced-cycle-programs.test.ts src/features/bootcamp/catalog.tsx src/features/trajectory-v2/page.tsx --max-warnings 0
      - name: Build complete frontend
        run: npm run build
