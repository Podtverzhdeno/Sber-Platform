name: Portfolio Recognition QA

on:
  push:
    branches: [main]
    paths:
      - "src/impulse/api/v1/portfolio.py"
      - "tests/test_portfolio_recognition.py"
      - ".github/workflows/portfolio-recognition-qa.yml"
  pull_request:
    paths:
      - "src/impulse/api/v1/portfolio.py"
      - "tests/test_portfolio_recognition.py"
      - ".github/workflows/portfolio-recognition-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-recognition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recognition-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install pinned dependencies
        run: uv sync --frozen
      - name: Verify code formatting
        run: uv run ruff format --check src/impulse/api/v1/portfolio.py tests/test_portfolio_recognition.py
      - name: Verify code lint
        run: uv run ruff check src/impulse/api/v1/portfolio.py tests/test_portfolio_recognition.py
      - name: Verify participant evidence, revocation and HR privacy
        run: uv run pytest tests/test_portfolio_recognition.py tests/test_portfolio_api.py -q
