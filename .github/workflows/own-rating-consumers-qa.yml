name: Owner rating consumers QA

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/features/rating-v2/own-standing.ts"
      - "frontend/src/features/rating-v2/own-standing.test.ts"
      - "frontend/src/features/rating-v2/topbar-rank.tsx"
      - "frontend/src/features/rating-v2/topbar-rank.test.tsx"
      - "frontend/src/features/rating-v2/page.tsx"
      - "frontend/src/features/rating-v2/page.test.tsx"
      - "frontend/e2e/topbar-ranking.spec.ts"
      - ".github/workflows/own-rating-consumers-qa.yml"
  pull_request:
    paths:
      - "frontend/src/features/rating-v2/own-standing.ts"
      - "frontend/src/features/rating-v2/topbar-rank.tsx"
      - "frontend/src/features/rating-v2/page.tsx"
      - "frontend/e2e/topbar-ranking.spec.ts"
      - ".github/workflows/own-rating-consumers-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: own-rating-consumers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  own-ranking:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck entire frontend
        run: npm run typecheck
      - name: Lint rating source and tests
        run: npx eslint src/features/rating-v2/own-standing.ts src/features/rating-v2/own-standing.test.ts src/features/rating-v2/topbar-rank.tsx src/features/rating-v2/topbar-rank.test.tsx src/features/rating-v2/page.tsx src/features/rating-v2/page.test.tsx e2e/topbar-ranking.spec.ts --max-warnings 0
      - name: Check privacy, version, person switch and leaderboard regression
        run: npx vitest run src/features/rating-v2/own-standing.test.ts src/features/rating-v2/topbar-rank.test.tsx src/features/rating-v2/page.test.tsx
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Topbar browser controls with private rating
        env:
          CI: "true"
        run: npx playwright test topbar-ranking.spec.ts --project=chromium --reporter=line
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: own-ranking-browser-evidence
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
