<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">IMPULSE design reference 8: Accessible interaction</title>
<desc id="svgdesc">Original vector schematic for IMPULSE developers. Inspired by general Apple design principles; not a screenshot, not an Apple component export. Official guidance: https://developer.apple.com/design/human-interface-guidelines/accessibility. Web rendering may not match native Liquid Glass.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f3fa"/><stop offset="1" stop-color="#e0e8f4"/></linearGradient>
<linearGradient id="photoGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b0c9ee"/><stop offset=".47" stop-color="#e6dde7"/><stop offset="1" stop-color="#eab8a6"/></linearGradient>
<linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2=".85"><stop stop-color="#ffffff" stop-opacity=".87"/><stop offset=".6" stop-color="#fafbff" stop-opacity=".64"/><stop offset="1" stop-color="#dceaff" stop-opacity=".72"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#29354b" flood-opacity=".11"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1473" cy="53" r="204" fill="#d8e3f5"/><circle cx="124" cy="867" r="182" fill="#dce7f9"/>
<text x="66" y="77" fill="#2477f2" font-size="17" font-weight="780" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">IMPULSE / DESIGN REFERENCE</text>
<text x="65" y="127" fill="#253249" font-size="38" font-weight="760" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">Accessible interaction</text>
<text x="67" y="157" fill="#6d7890" font-size="18" font-weight="530" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">Focus • contrast • motion</text>
<rect x="1350" y="70" width="88" height="32" rx="16" fill="#e6efff" stroke="none" stroke-width="1" opacity="1"/><text x="1363" y="91" fill="#2477f2" font-size="14" font-weight="650" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">08 / 12</text>
<g filter="url(#shadow)"><rect x="62" y="184" width="1476" height="624" rx="28" fill="#ffffff" stroke="#dce3ed" stroke-width="1.2" opacity="1"/><rect x="62" y="184" width="1476" height="76" rx="28" fill="#fbfcff" stroke="none" stroke-width="1" opacity="1"/><rect x="62" y="243" width="1476" height="1" rx="0" fill="#dce3ed" stroke="none" stroke-width="1" opacity="1"/><circle cx="99" cy="220" r="8" fill="#ff6b6b"/><circle cx="124" cy="220" r="8" fill="#ffc05a"/><circle cx="149" cy="220" r="8" fill="#56c78b"/><text x="190" y="228" fill="#253249" font-size="21" font-weight="700" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">Accessible interaction</text><text x="1368" y="226" fill="#6d7890" font-size="13" font-weight="600" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">WEB REFERENCE</text></g>
<text x="115" y="304" fill="#253249" font-size="27" font-weight="740" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">Focus-visible и контраст</text><rect x="111" y="334" width="640" height="395" rx="24" fill="#f4f7fb" stroke="none" stroke-width="1" opacity="1"/><rect x="167" y="386" width="536" height="77" rx="16" fill="#fff" stroke="#2477f2" stroke-width="4" opacity="1"/><text x="196" y="432" fill="#253249" font-size="20" font-weight="700" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">Фокус виден на кнопке</text><rect x="173" y="506" width="189" height="54" rx="12" fill="#2477f2" stroke="none" stroke-width="1" opacity="1"/><text x="200" y="541" fill="#fff" font-size="18" font-weight="680" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">Продолжить</text><text x="171" y="610" fill="#6d7890" font-size="17" font-weight="500" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">Клавиатура: Tab → Enter → Esc</text><rect x="789" y="335" width="625" height="394" rx="24" fill="#243044" stroke="none" stroke-width="1" opacity="1"/><text x="825" y="389" fill="#bcd0f4" font-size="16" font-weight="730" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">REDUCED TRANSPARENCY</text><rect x="821" y="419" width="545" height="206" rx="15" fill="#fff" stroke="none" stroke-width="1" opacity="1"/><text x="849" y="471" fill="#253249" font-size="19" font-weight="750" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">Читаемый непрозрачный слой</text><text x="849" y="504" fill="#6d7890" font-size="16" font-weight="500" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">Без эффектов размытия</text><text x="849" y="542" fill="#6d7890" font-size="16" font-weight="500" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">Увеличение масштаба до 200%</text>
<text x="76" y="855" fill="#6d7890" font-size="17" font-weight="520" font-family="Inter, -apple-system, Segoe UI, Arial, sans-serif">Independent SVG schematic • not an official Apple design kit • source: Apple HIG / Design Resources</text>
