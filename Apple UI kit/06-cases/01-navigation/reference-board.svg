<title id="svgtitle">IMPULSE design reference 1: Sidebar / Toolbar</title>
<desc id="svgdesc">Original vector schematic for IMPULSE developers. Inspired by general Apple design principles; not a screenshot, not an Apple component export. Official guidance: https://developer.apple.com/design/human-interface-guidelines/sidebars. Web rendering may not match native Liquid Glass.</desc>
