<linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2=".85"><stop stop-color="#ffffff" stop-opacity=".87"/><stop offset=".6" stop-color="#fafbff" stop-opacity=".64"/><stop offset="1" stop-color="#dceaff" stop-opacity=".72"/></linearGradient>
