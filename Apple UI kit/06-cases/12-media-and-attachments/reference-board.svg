<title id="svgtitle">IMPULSE design reference 12: Media / Attachments</title>
<desc id="svgdesc">Original vector schematic for IMPULSE developers. Inspired by general Apple design principles; not a screenshot, not an Apple component export. Official guidance: https://developer.apple.com/design/human-interface-guidelines/materials. Web rendering may not match native Liquid Glass.</desc>
