[project]
name = "impulse"
version = "0.1.0"
description = "Impulse platform"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "langchain>=0.3,<2",
  "langchain-openrouter>=0.0.1,<1",
  "langfuse>=3,<4",
  "langgraph>=0.6,<2",
  "orjson>=3.10,<4",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
impulse-api = "impulse.main:run"
impulse-demo-reset = "impulse.bootstrap.demo_seed:main_reset"
impulse-demo-seed = "impulse.bootstrap.demo_seed:main_seed"
impulse-secret-scan = "impulse.quality.secret_scan:main"

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impulse"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "spec(reference): traceability marker for an OpenSpec scenario",
  "integration: requires an external PostgreSQL test database",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = [".venv", "frontend", "migrations"]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
branch = true
source = ["impulse"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
