schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Before any implementation, every agent session must read the active change tasks,
  agent-work-coordination spec, parallel-agent-workflow document, git status, and all
  active claim status files. No product write is allowed before a successful atomic claim.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - Read `changes/impulse-ecosystem/specs/agent-work-coordination/spec.md` completely before changing files.
      - Read `changes/impulse-ecosystem/docs/parallel-agent-workflow.md`, `changes/impulse-ecosystem/tasks.md`, `git status` and every active `.agents/coordination/claims/*/status.md` before selecting work.
      - Create an atomic claim with `IN_PROGRESS` and a non-conflicting write-scope before the first product write.
      - Do not change a task checkbox to `[x]`; only the independent reviewer/integrator may accept it after evidence checks.
      - If there is no safe READY task, return `NO_SAFE_TASK` instead of editing a claimed or dirty file.
      - Select a conflict-free wave: do not start READY tasks whose write scopes overlap each other, active claims, or the main agent reserved scope.
      - Run task-scoped checks as author, preserve independent review, and leave full regression/build/OpenSpec/screenshot checks to one integration task per exact revision.
      - Do not deploy or run external production smoke unless the current task is explicitly approval-gated for that operation.
      - An isolated AI Engineering Platform worker with a validated `.aip-task-contract.json` may use its hashed context manifest instead of rereading the entire global backlog and unrelated claims; manual sessions may not.
  archive:
    guidance:
      - Do not archive the change while any claim is `IN_PROGRESS`, `BLOCKED` or `REVIEW`.
      - Preserve coordination audit history and ensure accepted tasks are `DONE` before archive.
